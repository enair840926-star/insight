name: 자산 데이터 수집

# 장 시간에 맞춰 데이터를 받아 폰 앱(docs/)에 배포한다.
# PC를 안 켜도 폰에는 항상 최신 숫자가 뜬다.
#
# 인사이트(Claude API)는 여기서 만들지 않는다 — API 키를 GitHub에 두지
# 않고, 의도치 않은 과금도 만들지 않기 위해서다. 인사이트가 필요하면
# PC에서 `git pull` 후 `python insight.py`를 돌린다. 클라우드가 받아 둔
# 프롬프트(cloud/)를 그대로 쓰므로 다시 수집하지 않는다.
#
# cron은 UTC다. 한국시간 = UTC + 9.
#   23:00 UTC = 08:00 KST  국장 개장 1시간 전   → kr + macro
#   12:30 UTC = 21:30 KST  미장 개장 1시간 전(여름) → us + macro + coin
#   13:30 UTC = 22:30 KST  미장 개장 1시간 전(겨울) → 여름엔 --auto가 건너뜀

on:
  workflow_dispatch:
    inputs:
      markets:
        description: '자산군 (비우면 --auto). 예: kr macro'
        required: false
        default: ''
  schedule:
    - cron: '0 23 * * 0-4'    # 일~목 23:00 UTC = 월~금 08:00 KST
    - cron: '30 12 * * 1-5'
    - cron: '30 13 * * 1-5'
  push:
    # 이 파일을 고치면 한 번 돌려 본다. 수집은 무료라 부담이 없다.
    paths:
      - '.github/workflows/collect.yml'

permissions:
  contents: write

concurrency:
  # 예약이 겹쳐 두 개가 동시에 push하면 충돌한다. 줄을 세운다.
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: pip install requests

      - name: 수집 + 대시보드
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          TZ: Asia/Seoul
        run: |
          python run.py ${{ github.event.inputs.markets || '--auto' }} \
            --no-insight --no-deploy --publish

      - name: 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs cloud
          if git diff --staged --quiet; then
            echo "변경 없음 — 갱신할 장이 없었습니다"
          else
            git commit -m "자동 수집 $(date +'%Y-%m-%d %H:%M') [skip ci]"
            # 다른 실행이 먼저 push했을 수 있다. 한 번 리베이스하고 재시도.
            git pull --rebase origin main || true
            git push
          fi
