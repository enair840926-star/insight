name: 자산 데이터 수집

# 장 시간에 맞춰 데이터를 받아 폰 앱(docs/)에 배포한다.
# PC를 안 켜도 폰에는 항상 최신 숫자가 뜬다.
#
# 인사이트(Claude API)는 여기서 만들지 않는다 — API 키를 GitHub에 두지
# 않고, 의도치 않은 과금도 만들지 않기 위해서다. 인사이트가 필요하면
# PC에서 `git pull` 후 `python insight.py`를 돌린다. 클라우드가 받아 둔
# 프롬프트(cloud/)를 그대로 쓰므로 다시 수집하지 않는다.
#
# cron은 UTC다. 한국시간 = UTC + 9.
#   23:00 UTC = 08:00 KST  국장 개장 1시간 전   → kr + macro
#   12:30 UTC = 21:30 KST  미장 개장 1시간 전(여름) → us + macro + coin
#   13:30 UTC = 22:30 KST  미장 개장 1시간 전(겨울) → 여름엔 --auto가 건너뜀

on:
  workflow_dispatch:
    inputs:
      markets:
        description: '자산군 (비우면 --auto). 예: kr macro'
        required: false
        default: ''
  schedule:
    # GitHub 예약은 자주 밀린다. 실측에서 08:00 예약이 08:58에 돌았고
    # 21:30 예약은 한 시간이 지나도 안 돌았다. 그래서 개장 전 구간에
    # 여러 번 걸어 두고, 먼저 도착한 것이 일한다.
    #
    # 중복 걱정은 없다. --auto가 개장이 임박한 장만 고르고, 3시간 안에
    # 이미 받은 자산군은 건너뛰므로 나머지는 몇 초 만에 끝난다.
    #
    # cron은 UTC. 한국시간 = UTC + 9.
    - cron: '20 22 * * 0-4'   # 07:20 KST  국장
    - cron: '50 22 * * 0-4'   # 07:50 KST
    - cron: '20 23 * * 0-4'   # 08:20 KST
    - cron: '50 11 * * 1-5'   # 20:50 KST  미장(서머타임)
    - cron: '20 12 * * 1-5'   # 21:20 KST
    - cron: '50 12 * * 1-5'   # 21:50 KST
    - cron: '20 13 * * 1-5'   # 22:20 KST  미장(겨울)
    - cron: '50 13 * * 1-5'   # 22:50 KST
  push:
    # 이 파일을 고치면 한 번 돌려 본다. 수집은 무료라 부담이 없다.
    # 결과를 저장소에 커밋하므로 main에서만 돈다.
    branches: [main]
    paths:
      - '.github/workflows/collect.yml'

permissions:
  contents: write

concurrency:
  # 예약이 겹쳐 두 개가 동시에 push하면 충돌한다. 줄을 세운다.
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # 인사이트 작성 시각을 git log에서 읽으므로 전체 이력이 필요하다.
          # depth 1이면 체크아웃 시각이 찍혀 오래된 글이 최신으로 보인다.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: pip install -r requirements.txt

      - name: 수집 + 대시보드
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          TZ: Asia/Seoul
        run: |
          ARGS="${{ github.event.inputs.markets }}"
          if [ -z "$ARGS" ] && [ "${{ github.event_name }}" = "push" ]; then
            # 워크플로를 고쳤을 때의 스모크 테스트. 코인이 제일 빠르고,
            # 미국 러너에서는 바이낸스가 막히므로 OKX 폴백까지 함께 탄다.
            ARGS="coin"
          fi
          if [ -z "$ARGS" ]; then ARGS="--auto"; fi
          echo "실행 인자: $ARGS"
          python run.py $ARGS --no-insight --no-deploy --publish

      - name: 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs cloud
          if git diff --staged --quiet; then
            echo "변경 없음 — 갱신할 장이 없었습니다"
          else
            git commit -m "자동 수집 $(date +'%Y-%m-%d %H:%M') [skip ci]"
            # 다른 실행이 먼저 push했을 수 있다. 한 번 리베이스하고 재시도.
            git pull --rebase origin main || true
            git push
          fi
