name: 국장 수집 진단

# 국장만 예약 실행에서 계속 빠졌다. 수동 실행으로는 되는데 예약으로는
# 한 번도 성공한 적이 없다. 러너 로그를 나중에 못 보므로, 여기서 돌려
# 어디서 얼마나 걸리는지 결과를 저장소에 남긴다.
#
# 원인을 찾으면 이 워크플로는 지운다.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt

      - name: 국장 수집 (시간 측정)
        id: run
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          TZ: Asia/Seoul
        run: |
          set +e
          mkdir -p notes
          {
            echo "# 국장 수집 진단"
            echo
            echo "- 실행: $(date '+%Y-%m-%d %H:%M %Z')"
            echo "- 러너: $(curl -s --max-time 10 https://ipinfo.io/json | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("country"),d.get("city"),d.get("org"))' 2>/dev/null || echo '확인 실패')"
            echo
            echo '```'
          } > notes/diag-kr.md

          start=$(date +%s)
          timeout 900 python collect_kr.py >/tmp/kr.log 2>&1
          code=$?
          end=$(date +%s)

          {
            tail -n 60 /tmp/kr.log
            echo '```'
            echo
            echo "**종료코드 $code · 소요 $((end-start))초**"
            if [ $code -eq 124 ]; then
              echo
              echo "> 124는 timeout이 끊은 것이다. 러너에서 15분을 넘겼다는 뜻."
            fi
          } >> notes/diag-kr.md

          echo "소요 $((end-start))초, 종료코드 $code"

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes/diag-kr.md
          git diff --staged --quiet || {
            git commit -m "국장 수집 진단 결과 [skip ci]"
            git pull --rebase origin main || true
            git push
          }
