name: 인사이트 반영

# insights/ 안의 글이 바뀌면 대시보드만 다시 굽는다.
# 수집은 하지 않으므로 30초쯤 걸리고, 폰에서 마크다운을 고쳐 커밋하면
# 1분 안에 앱에 반영된다. API 호출이 없어 요금도 없다.

on:
  workflow_dispatch:
  push:
    # main만 받는다. 브랜치를 안 걸면 아무 브랜치 푸시에도 돌고,
    # 아래 커밋 단계가 `git pull --rebase origin main`을 하므로
    # 그 브랜치에 main이 섞여 버린다.
    branches: [main]
    paths:
      - 'insights/**'

# 러너는 UTC로 돈다. 여기 한 번 걸어 모든 단계가 한국시간을 쓰게 한다.
# 커밋 메시지의 `인사이트 반영 HH:MM`이 UTC로 찍히고 있었다.
env:
  TZ: Asia/Seoul

permissions:
  contents: write

concurrency:
  # 수집 워크플로와 같은 줄에 세운다. 둘이 동시에 docs/를 밀면 충돌한다.
  group: collect
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # 대시보드가 인사이트 작성 시각을 git log에서 읽는다. 기본값(depth 1)
          # 이면 파일 이력을 못 찾아 mtime으로 물러서고, 체크아웃 시각이
          # 찍혀 오래된 인사이트가 '방금 작성'으로 보인다.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: pip install -r requirements.txt

      - name: 대시보드 다시 굽기
        # 수집 없이 cloud/에 있는 최신 데이터로만 그린다.
        run: python run.py --skip-collect --no-insight --no-deploy

      - name: 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "인사이트 반영 $(date +'%Y-%m-%d %H:%M') [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
